<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>커뮤니티 게시글형 숏츠 생성기</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- 편집 중에만 보이는 안내 라벨. ?clean=1 파라미터를 붙이면 숨겨집니다. -->
  <div id="stage-label">1080 × 1920 미리보기 — 녹화 시에는 URL 뒤에 ?clean=1 을 붙이세요</div>

  <div id="stage">
    <div id="frame">
      <div id="scroller">

        <!-- 커뮤니티 상단 바 -->
        <header id="post-topbar">
          <span class="topbar-back">‹</span>
          <span class="topbar-board" id="board-name">커뮤니티</span>
          <span class="topbar-menu">⋮</span>
        </header>

        <!-- 게시글 -->
        <article id="post">
          <h1 id="post-title"></h1>
          <div id="post-meta">
            <span id="meta-nick"></span>
            <span class="dot">·</span>
            <span id="meta-time"></span>
            <span class="dot">·</span>
            <span id="meta-views"></span>
          </div>
          <hr class="divider" />
          <div id="post-body"><!-- script.js가 content.js 데이터로 문단을 채웁니다 --></div>
        </article>

        <!-- 댓글 -->
        <section id="comments-section">
          <div class="comments-header">
            <span class="comments-icon">💬</span>
            <span id="comments-count-label">댓글</span>
          </div>
          <hr class="divider" />
          <div id="comments-list"><!-- script.js가 content.js 데이터로 댓글을 채웁니다 --></div>
        </section>

        <div id="end-spacer"></div>
      </div>
    </div>
  </div>

  <div id="controls">
    <button id="replay-btn" type="button">⟲ 다시 재생</button>
    <span id="timer">0.0s / 0.0s</span>
  </div>

  <script src="content.js"></script>
  <script src="script.js"></script>
</body>
</html>
